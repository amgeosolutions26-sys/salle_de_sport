<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon espace | Allianz Salam Fitness Club</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101010;--or:#f5b800;--bg:#f2f1ee;--line:#e3e0d8;--mut:#77736a;--ok:#1f8a70;--warn:#d9930d;--bad:#c4372c}
*{box-sizing:border-box}body{margin:0;font:15px "DM Sans",sans-serif;background:var(--bg);color:#171717}h1,h2{font-family:Oswald;margin:0}
header{background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 5%;gap:10px}.brand{font:700 21px Oswald;letter-spacing:2px}.brand b{color:var(--or)}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 3%}nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px;font:inherit;cursor:pointer;white-space:nowrap}nav button.on{border-color:var(--or);font-weight:700}
main{max-width:900px;margin:0 auto;padding:22px 5%}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-top:16px}
.kpi,.card{background:#fff;border:1px solid var(--line);padding:14px 16px}.kpi small{color:var(--mut);display:block;margin-bottom:6px}.kpi b{font:600 22px Oswald}
.card{margin-top:16px}input,select{padding:11px;border:1px solid #ccc;font:inherit;width:100%}input:focus,select:focus,button:focus-visible{outline:2px solid var(--or)}
label{display:grid;gap:5px;font-size:12px;color:var(--mut);margin-bottom:12px}.btn{background:var(--or);color:#111;border:0;padding:11px 18px;font:700 13px "DM Sans";cursor:pointer}.btn.o{background:#fff;border:1px solid #bbb}.btn.s{padding:6px 10px;font-size:12px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);margin-top:16px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 12px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:500;background:#fafaf8}
.b{padding:3px 10px;font-size:12px;border-radius:99px;color:#fff;background:#888}.b.actif{background:var(--ok)}.b.bientôt{background:var(--warn)}.b.expiré{background:var(--bad)}
.hero{display:flex;gap:18px;align-items:center}.av{width:84px;height:84px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font:700 28px Oswald;object-fit:cover}
header{background:linear-gradient(90deg,#0a0a0a,#1b1606)}.brand{display:flex;align-items:center;gap:10px;font-size:15px!important;letter-spacing:1px}.brand img{height:42px;width:42px;border-radius:50%}
@keyframes fu{from{opacity:0;transform:translateY(12px)}}@keyframes grow{from{width:0}}@keyframes pop{from{opacity:0;transform:scale(.95)}}main>*{animation:fu .4s both}main>*:nth-child(2){animation-delay:.07s}main>*:nth-child(3){animation-delay:.14s}
.kpi,.card{transition:transform .2s,box-shadow .2s}.kpi:hover,.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002}.kpi{border-top:3px solid var(--or)}.btn{transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn:active{transform:scale(.97)}tr:hover td{background:#fff8dc}nav button{transition:background .2s}nav button:hover{background:#fff8dc}
.bar{height:10px;background:#eee;border-radius:9px;margin:10px 0 4px;overflow:hidden;min-width:220px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f5b800,#ffd24a);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}.av{box-shadow:0 0 0 3px var(--or)}#qrb{animation:pop .4s both;box-shadow:0 0 0 3px var(--or)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.login{max-width:380px;margin:8vh auto;padding:0 5%}.msg{color:var(--bad);font-weight:700;min-height:20px}.ok{color:var(--ok)}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const F=n=>Math.round(n).toLocaleString("fr-FR")+" FCFA",TODAY=new Date().toISOString().slice(0,10),fd=s=>s?s.split("-").reverse().join("/"):"—",PL={m:{n:"Mensuel",p:25000,d:30},t:{n:"Trimestriel",p:65000,d:90},a:{n:"Annuel",p:220000,d:365}},KIND={new:"Nouvel abonnement",renewal:"Renouvellement",session:"Séance ponctuelle"},LAB={actif:"Actif",bientôt:"Expire bientôt",expiré:"Expiré",aucun:"Aucun abonnement"};
const hp=async s=>{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("elite|"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=5381;for(const ch of "elite|"+s)h=(h*33^ch.charCodeAt(0))>>>0;return"f"+h};
let D=null,sb;const L=()=>D;
let cid=null,tab="acc",photo="",tk=new URLSearchParams(location.search).get("c")||localStorage.getItem("eliteTok")||"";if(tk){localStorage.setItem("eliteTok",tk);history.replaceState(null,"",location.pathname)}
function drawQR(el,text,px){const t=document.createElement("div"),m=new QRCode(t,{text:text,width:64,height:64,correctLevel:QRCode.CorrectLevel.M})._oQRCode,n=m.getModuleCount(),qz=4,tot=n+2*qz,s=Math.max(4,Math.round(px/tot)),cv=document.createElement("canvas");cv.width=cv.height=tot*s;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m.isDark(r,c))x.fillRect((c+qz)*s,(r+qz)*s,s,s);cv.style.cssText="display:block;margin:0 auto;image-rendering:pixelated";el.appendChild(cv);return cv}
const TABS=[["acc","🏠 Accueil"],["prof","👤 Mon profil"],["abo","🎟️ Mon abonnement"],["pay","💳 Mes paiements"],["pre","🕘 Mes présences"],["qr","▦ Mon QR Code"]];
function info(d,c){const s=d.subs.filter(x=>x.cid===c.id).sort((a,b)=>a.end<b.end?1:-1)[0],dl=s?(Date.parse(s.end)-Date.parse(TODAY))/864e5:null;return{s,dl,k:!s?"aucun":dl<0?"expiré":dl<=7?"bientôt":"actif"}}
const pmap=d=>{const m={};d.pays.forEach(p=>m[p.ref||p.id]=(m[p.ref||p.id]||0)+p.paid);return m},kp=(l,v)=>`<div class="kpi"><small>${l}</small><b>${v}</b></div>`,T=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.join("")||`<tr><td colspan="${h.length}">Aucune donnée.</td></tr>`}</table></div>`;
const av=c=>c.photo?`<img class="av" src="${c.photo}" alt="">`:`<div class="av">${esc((c.prenom[0]||"")+(c.nom[0]||""))}</div>`,dtxt=(i)=>i.s?(i.dl<0?"Expiré depuis "+(-i.dl)+" j":i.dl===0?"Expire aujourd'hui":i.dl+" jour(s)"):"—";
function login(m){$("#app").innerHTML=`<div class="login"><h1>ALLIANZ SALAM FITNESS CLUB</h1><div class="card"><p class="msg">${m||"Lien d'accès introuvable ou révoqué."}</p><p style="color:var(--mut)">Ouvrez le lien personnel que la salle vous a envoyé. Pour en obtenir un nouveau, adressez-vous à l'accueil.</p></div></div>`}
function recu(id){const d=L(),p=d.pays.find(x=>x.id===id),c=d.clients.find(x=>x.id===p.cid),r=p.ref?0:Math.max(0,p.due-(pmap(d)[p.id]||0));
 const h=`<!DOCTYPE html><meta charset="utf-8"><title>Reçu ${p.id}</title><body style="font-family:sans-serif;max-width:480px;margin:30px auto"><h2>ALLIANZ SALAM FITNESS CLUB</h2><h3>Reçu n° ${p.id}</h3><p>Date : ${fd(p.date)} ${p.time||""}<br>Client : ${esc(c.prenom)} ${esc(c.nom)}<br>Nature : ${KIND[p.kind]}${p.ref?" (solde)":""}${p.plan?"<br>Formule : "+PL[p.plan].n:""}<br>Mode : ${p.mode||"Espèces"}</p><p style="font-size:22px"><b>Montant encaissé : ${F(p.paid)}</b></p>${p.ref?"":`<p>Montant dû : ${F(p.due)}<br>Reste à payer : ${F(r)}</p>`}<p style="color:#888;font-size:12px">Document généré le ${fd(TODAY)}.</p></body>`;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download="recu-"+p.id+".html";a.click()}
const V={
 acc(d,c,i){const lp=d.pays.filter(p=>p.cid===c.id&&p.paid>0).sort((a,b)=>(b.date+(b.time||""))>(a.date+(a.time||""))?1:-1)[0];return`<div class="card hero">${av(c)}<div><h1>${new Date().getHours()>=18?"Bonsoir":"Bonjour"} ${esc(c.prenom)} !</h1><span class="b ${i.k}">${LAB[i.k]}</span>${i.s?`<div class="bar"><i style="width:${Math.max(0,Math.min(100,i.dl/PL[i.s.plan].d*100))}%"></i></div><small style="color:var(--mut)">${dtxt(i)}</small>`:""}</div></div><div class="grid">${kp("Formule actuelle",i.s?PL[i.s.plan].n:"—")}${kp("Date de début",fd(i.s&&i.s.start))}${kp("Date d'expiration",fd(i.s&&i.s.end))}${kp("Jours restants",dtxt(i))}${kp("Dernier paiement",lp?F(lp.paid)+" le "+fd(lp.date):"—")}${kp("Prochaine expiration",fd(i.s&&i.s.end))}${kp("Visites au total",d.visits.filter(v=>v.cid===c.id).length)}</div>${i.k==="bientôt"||i.k==="expiré"?`<div class="card" style="border-color:var(--warn)">Votre abonnement ${i.k==="expiré"?"est expiré":"arrive à échéance"}. Rendez-vous dans « Mon abonnement » pour demander un renouvellement.</div>`:""}`},
 prof(d,c){photo="";return`<form id="pf" class="card"><h2>Mes informations</h2><div class="grid"><label>Nom<input value="${esc(c.nom)}" disabled></label><label>Prénom<input value="${esc(c.prenom)}" disabled></label><label>Téléphone<input value="${esc(c.tel)}" disabled></label><label>Inscrit le<input value="${fd(c.date)}" disabled></label></div><p style="font-size:12px;color:var(--mut)">Le nom, le téléphone et l'état du compte ne se modifient qu'avec la salle.</p><div class="grid"><label>Adresse<input name="adresse" value="${esc(c.adresse)}"></label><label>E-mail<input name="email" type="email" value="${esc(c.email)}"></label><label>Photo de profil<input type="file" id="ph" accept="image/*"></label></div><p class="msg" id="pm"></p><button class="btn">Enregistrer</button></form>`},
 abo(d,c,i){const s=i.s,pl=s&&PL[s.plan],rq=(d.reqs||[]).filter(r=>r.cid===c.id).reverse(),pend=rq.some(r=>r.s==="en attente")||(d.claims||[]).some(x=>x.s==="en attente");return`<div class="card"><h2>Mon abonnement</h2>${s?T(["Formule","Prix","Durée","Début","Expiration","Statut"],[`<tr><td>${pl.n}</td><td>${F(pl.p)}</td><td>${pl.d} jours</td><td>${fd(s.start)}</td><td>${fd(s.end)}</td><td><span class="b ${i.k}">${LAB[i.k]}</span> ${dtxt(i)}</td></tr>`]):"<p>Aucun abonnement pour le moment.</p>"}</div>
 <div id="rf" class="card"><h2>Renouveler mon abonnement</h2>${pend?`<p>Votre demande ou votre paiement est en cours de vérification par la salle. Merci !</p>`:`<label>Formule<select id="rp">${Object.keys(PL).map(k=>`<option value="${k}" ${s&&s.plan===k?"selected":""}>${PL[k].n} — ${F(PL[k].p)}</option>`).join("")}</select></label><p style="margin:0 0 8px;color:var(--mut);font-size:12px">Comment souhaitez-vous payer ?</p><div class="pm" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-pm="Wave">🌊 Wave</button><button type="button" class="btn" data-pm="Orange Money">🟠 Orange Money</button><button type="button" class="btn o" data-pm="Espèces">💵 Espèces à la salle</button></div><div id="pmx" style="margin-top:14px"></div>`}</div>${rq.length?T(["Demande du","Formule","Statut"],rq.map(r=>`<tr><td>${fd(r.date)}</td><td>${PL[r.plan].n}</td><td>${r.s}</td></tr>`)):""}`},
 pay(d,c){const pm=pmap(d),r=d.pays.filter(p=>p.cid===c.id).sort((a,b)=>(b.date+(b.time||""))>(a.date+(a.time||""))?1:-1);return`<h2 style="margin-top:6px">Mes paiements</h2>`+T(["Date","Montant","Mode","Type","Statut","Reçu"],r.map(p=>{const t=pm[p.ref||p.id]||0,s=p.ref?"Solde réglé":t>=p.due?"Payé":t>0?"Partiel":"Impayé";return`<tr><td>${fd(p.date)}</td><td>${F(p.paid)}</td><td>${p.mode||"Espèces"}</td><td>${KIND[p.kind]}</td><td>${s}</td><td>${p.paid>0?`<button class="btn s o" data-r="${p.id}">Télécharger</button>`:""}</td></tr>`}))},
 pre(d,c){const v=d.visits.filter(x=>x.cid===c.id).sort((a,b)=>(b.date+(b.t||""))>(a.date+(a.t||""))?1:-1);return`<h2 style="margin-top:6px">Mes présences (${v.length})</h2>`+T(["Date","Heure"],v.slice(0,200).map(x=>`<tr><td>${fd(x.date)}</td><td>${x.t||"—"}</td></tr>`))},
 qr(d,c){return`<div class="card" style="text-align:center"><h2>Mon QR Code</h2><p style="color:var(--mut)">Présentez-le à l'entrée de la salle. Il est personnel et permanent ; seul l'administrateur peut le régénérer.</p><div id="qrb" style="display:inline-block;padding:0;background:#fff"></div><p><b>${esc(c.prenom)} ${esc(c.nom)}</b></p><button class="btn o" id="qd">Télécharger l'image</button></div>`}};
function render(){const d=L();const c=d&&tk&&d.clients.find(x=>x.lk&&x.lk===tk);if(!c)return login();cid=c.id;if(c.state!=="actif")return login("Compte "+c.state+" : contactez la salle.");
 $("#app").innerHTML=`<header><div class="brand"><img src="logo.jpg" alt="">ALLIANZ SALAM FITNESS CLUB</div><span style="font-size:13px;color:#bbb">Espace client</span></header><nav>${TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?"on":""}">${l}</button>`).join("")}</nav><main>${V[tab](d,c,info(d,c))}</main>`;
 if(tab==="qr"){if(window.QRCode){drawQR($("#qrb"),new URL("verif.html?q="+c.qr,location.href).href,240);$("#qd").onclick=()=>{const cv=$("#qrb canvas");if(!cv)return;const a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download="mon-qr-elite.png";a.click()}}else $("#qrb").textContent=c.qr}
 if(tab==="prof"){$("#ph").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=document.createElement("canvas");k.width=k.height=160;const m=Math.min(im.width,im.height);k.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);photo=k.toDataURL("image/jpeg",.8)};im.src=URL.createObjectURL(f)};
  $("#pf").onsubmit=async e=>{e.preventDefault();const f=e.target,{error}=await sb.rpc("client_update",{tok:tk,p_adresse:f.adresse.value,p_email:f.email.value,p_photo:photo||""});if(error){$("#pm").textContent="Erreur : "+error.message;return}await load2();render()};}
 if(tab==="abo"&&$("#rf")){const pm0=$("#rf .pm");if(pm0)pm0.onclick=e=>{const b=e.target.closest("[data-pm]");if(!b)return;const m=b.dataset.pm,pl=$("#rp").value,amt=PL[pl].p,g=k=>((d.settings||[]).find(x=>x.id===k)||{}).v||"",x=$("#pmx"),link=g("wave"),num=g("om");
 if(m==="Espèces"){x.innerHTML=`<p>Rendez-vous à la salle avec <b>${F(amt)}</b>. Envoyer la demande ?</p><button class="btn" id="go">Envoyer la demande</button>`;$("#go").onclick=async()=>{await sb.rpc("client_request",{tok:tk,p_plan:pl});await load2();render()};return}
 if(m==="Wave"&&!link||m!=="Wave"&&!num){x.innerHTML='<p class="msg">Ce mode de paiement n\'est pas encore disponible. Choisissez un autre mode.</p>';return}
 x.innerHTML=(m==="Wave"?`<p>1. Payez <b>${F(amt)}</b> sur Wave :</p><a class="btn" target="_blank" rel="noopener" href="${esc(link+(link.includes("?")?"&":"?")+"amount="+amt)}">Ouvrir Wave et payer</a>`:`<p>1. Envoyez <b>${F(amt)}</b> par Orange Money au <b>${esc(num)}</b> :</p><a class="btn" href="tel:%23144%23">Ouvrir Orange Money (#144#)</a> <button class="btn o" type="button" id="cp">Copier le numéro</button>`)+`<p>2. Saisissez la référence reçue par SMS :</p><input id="tx" placeholder="Référence de la transaction" maxlength="60"><p></p><button class="btn" id="go">J'ai payé : envoyer pour validation</button><p class="msg" id="rm"></p>`;
 if($("#cp"))$("#cp").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(num);
 $("#go").onclick=async()=>{const t=$("#tx").value.trim();if(t.length<4){$("#rm").textContent="Saisissez la référence de la transaction.";return}const{error}=await sb.rpc("client_claim",{tok:tk,p_plan:pl,p_mode:m,p_ref:t});if(error){$("#rm").textContent="Erreur : "+error.message;return}await load2();render()}}}}
async function load2(){const{data,error}=await sb.rpc("client_space",{tok:tk});if(error)throw error;if(data.error)return data;D={clients:[data.client],subs:data.subs,pays:data.pays,visits:data.visits,reqs:data.reqs,settings:data.settings,claims:data.claims};return null}
async function boot(){try{sb=supabase.createClient(SB_URL,SB_KEY);if(!tk)return login();const e=await load2();if(e)return login(e.error==="state"?"Compte "+e.state+" : contactez la salle.":null);render()}catch(x){login("Connexion impossible : "+x.message)}}
new MutationObserver(()=>document.querySelectorAll(".kpi b").forEach(b=>{const m=b.textContent.match(/^([\d\s\u202f\u00a0]*\d)\s*(FCFA)?$/);if(!m||b.dataset.c)return;b.dataset.c=1;const v=+m[1].replace(/[\s\u202f\u00a0]/g,""),s=m[2]?" FCFA":"",t0=performance.now(),f=n=>{const p=Math.min(1,(n-t0)/800);b.textContent=Math.round(v*(1-Math.pow(1-p,3))).toLocaleString("fr-FR")+s;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})).observe(document.getElementById("app"),{childList:true});
setInterval(async()=>{if(!sb||!tk||document.hidden||!["acc","pay","pre"].includes(tab))return;try{if(!(await load2()))render()}catch(e){}},60000);
document.addEventListener("click",e=>{const t=e.target.closest("[data-t]"),r=e.target.closest("[data-r]");if(t){tab=t.dataset.t;render()}else if(r)recu(r.dataset.r);});boot();
</script></body></html>
