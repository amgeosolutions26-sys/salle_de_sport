<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="logo.jpg">
  <meta name="theme-color" content="#0a0a0a">
  <title>Vérification du membre | ALLIANZ SALAM FITNESS CLUB</title>
  <style>
    :root{--or:#f5b800;--ok:#1f8a70;--warn:#d9930d;--bad:#c4372c}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;padding:20px;display:grid;place-items:center;background:#0a0a0a;color:#fff;font:16px system-ui,sans-serif}
    .wrap{width:min(440px,100%);text-align:center}
    .logo{width:104px;height:104px;border-radius:50%;box-shadow:0 0 30px #f5b80055}
    h1{font-size:17px;letter-spacing:1px;margin:12px 0 20px}
    .result{padding:22px;border-radius:8px;background:#161616;border:1px solid #333}
    .result.ok{background:var(--ok);border-color:var(--ok)}
    .result.warn{background:var(--warn);border-color:var(--warn)}
    .result.bad{background:var(--bad);border-color:var(--bad)}
    .result h2{font-size:25px;margin:0 0 7px}
    .name{font-size:20px;font-weight:700;margin:16px 0 6px}
    .message{margin:0;line-height:1.55}
    .presence{color:#ddd;margin:12px 0 0}
    .hint{color:#aaa;font-size:13px;margin:16px 0 0}
    @media(max-width:480px){body{padding:16px}.logo{width:84px;height:84px}.result{padding:18px}.result h2{font-size:22px}}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo.jpg" alt="Allianz Salam Fitness Club">
    <h1>ALLIANZ SALAM FITNESS CLUB</h1>
    <div id="result" class="result" role="status" aria-live="polite">Vérification en cours…</div>
    <p class="hint">Contrôle terminé. Vous pouvez fermer cette page.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script>
    const box=document.querySelector("#result");
    const names={unknown:"QR code inconnu.",inactive:"Compte suspendu ou désactivé.",no_subscription:"Aucun abonnement trouvé.",expired:"Abonnement expiré.",valid:"Abonnement valide : accès autorisé.",soon_expired:"Abonnement bientôt expiré : accès autorisé."};
    const escapeHTML=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    (async()=>{
      try{
        const qr=new URLSearchParams(location.search).get("q")||"";
        if(!qr){box.className="result bad";box.innerHTML="<h2>QR code manquant</h2><p class=\"message\">Scannez le QR code de la carte de membre avec l'appareil photo de votre téléphone.</p>";return}
        const client=supabase.createClient(SB_URL,SB_KEY);
        const{data,error}=await client.rpc("verify_member_qr",{p_qr:qr});
        if(error)throw error;
        if(!data||typeof data!=="object")throw new Error("Réponse de vérification invalide.");
        const allowed=data.result==="authorized"||data.result==="warning";
        box.className="result "+(allowed?(data.result==="warning"?"warn":"ok"):"bad");
        box.innerHTML=`<h2>${allowed?"ACCÈS AUTORISÉ":"ACCÈS REFUSÉ"}</h2><p class="message">${escapeHTML(names[data.reason]||"Vérification impossible.")}</p>${data.name?`<p class="name">${escapeHTML(data.name)}</p>`:""}${allowed?`<p class="presence">${data.presence==="duplicate"?"Présence déjà enregistrée récemment.":"Présence enregistrée à "+escapeHTML(data.time||"")+"."}</p>`:""}`;
      }catch(error){
        box.className="result bad";
        box.innerHTML=`<h2>Vérification impossible</h2><p class="message">${escapeHTML(error.message||error)}. Vérifiez la connexion et que le schéma Supabase a été mis à jour.</p>`;
      }
    })();
  </script>
</body>
</html>
